plugins {
	id 'net.fabricmc.fabric-loom' version "1.17.17"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	mods {
		"stackz" {
			sourceSet sourceSets.main
		}
	}
}

repositories {
	// Add repositories to retrieve artifacts from here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// Fabric tests these predicates against the loader's *normalized* game version,
// not Mojang's id: 26.3-snapshot-10 is compared as 26.3-alpha.10. So a floor of
// ">=26.3" is false on every 26.3 snapshot, and writing the obvious thing makes
// the mod refuse to load on the version it was built for. Derived from the pin
// rather than written into the manifest, so the two cannot drift apart.
def mcFloor = project.minecraft_version
	.replaceFirst(/-snapshot-/, '-alpha.')
	.replaceFirst(/-pre-/, '-pre.')
	.replaceFirst(/-rc-/, '-rc.')
// The trailing dash is load-bearing: "<26.4" would still admit 26.4's snapshots,
// because a prerelease sorts below its own release.
def mcParts = mcFloor.tokenize('.-')
def minecraftDependency = ">=${mcFloor} <${mcParts[0]}.${(mcParts[1] as int) + 1}-"
// The +26.3 build tag is ignored in comparison; the floor is the number.
def fabricApiFloor = ">=" + project.fabric_version.replaceFirst(/\+.*$/, '')

processResources {
	inputs.property "version", project.version
	inputs.property "minecraftDependency", minecraftDependency
	inputs.property "loaderVersion", project.loader_version
	inputs.property "fabricApiVersion", fabricApiFloor

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
		       "minecraftDependency": minecraftDependency,
		       "loaderVersion": project.loader_version,
		       "fabricApiVersion": fabricApiFloor
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
	// The readme rides in the jar beside the licence, so a server can show it in-game.
	from("README.md") {
		rename { "README_${project.base.archivesName.get()}.md" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// temporary solutions to resolve your dependencies.
		// However if you want to publish your artifact to a specific location, you can set it here.
	}
}
